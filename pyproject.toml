[project]
name = "salt-pki"
version = "1.0.1"
dependencies = ["acme", "cryptography", "distro", "salt"]
requires-python = ">=3.10,<4.0"

[dependency-groups]
test = [
  "matchlib",      #
  "pylint~=4.0.4",
  "pytest~=9.0.2",
]
lint = [
  "ruff==0.16.6", #
]
dev = [
  { include-group = "test" }, #
  { include-group = "lint" },
  "mypy~=2.0",
  "nox~=2025.5.1",
]

[tool.pyright]
include = ["salt_tower", "test"]
exclude = [
  "test/fixtures",
  "**/node_modules",
  "**/__pycache__",
  "**/.*",
  ".venv",
]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
builtins = ["__grains__", "__opts__", "__pillar__", "__salt__"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
extend-select = ["I"]
